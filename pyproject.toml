[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miadi"
version = "0.1.0"
description = "Miadi: a clinic appointment booking REST API (FastAPI + PostgreSQL)."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies. requirements.txt mirrors this list for Docker and Render;
# tests/test_dependencies.py fails if the two ever drift apart.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "tzdata>=2024.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pinned to a minor series so new lint rules can't suddenly fail CI.
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style puts calls in default arguments on purpose:
#   def endpoint(db: Session = Depends(get_db))
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
branch = true
# Report paths relative to the repo root (app/services/booking.py) so Coveralls
# can match them to files in GitHub.
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 99
