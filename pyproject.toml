[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miadi"
version = "0.1.0"
description = "Miadi: a clinic appointment booking REST API (FastAPI + PostgreSQL)."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies, as loose ranges. This file is the source of truth: the exact
# versions that CI, Docker and Render install are locked in requirements/ (see
# requirements/README.md). tests/project/test_dependencies.py fails if the lock
# files fall out of step with this list.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "tzdata>=2024.1",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pinned to a minor series so new lint rules can't suddenly fail CI.
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.services", "app.web"]

[tool.setuptools.package-data]
"app.web" = ["templates/**/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP", "D101", "D102", "D103", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"alembic/**" = ["D"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style puts calls in default arguments on purpose:
#   def endpoint(db: Session = Depends(get_db))
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
branch = true
# Report paths relative to the repo root (app/services/booking.py) so Coveralls
# can match them to files in GitHub.
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 99
