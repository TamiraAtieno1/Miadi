name: Deploy

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel a deploy that has started

jobs:
  test:
    uses: ./.github/workflows/ci.yml   # lint, format check and tests first

  deploy:
    needs: test                        # only runs if everything above passed
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
